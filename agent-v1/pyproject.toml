[project]
name = "agentv1"
version = "0.1.0"
description = "Unitronic sales/support agent platform - one platform, two personas"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymongo>=4.8",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "transformers>=4.45",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pymysql>=1.1",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentv1"]
